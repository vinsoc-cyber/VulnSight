# VulnSight
#
#   cp .env.example .env          # optional AI / NVD keys
#   GH_TOKEN=$(gh auth token) docker compose up --build
#   open http://127.0.0.1:5000
#
# The published port is loopback-only. Gunicorn still binds 0.0.0.0 inside
# the container, so if .env has AI/GitHub keys and no VULNSIGHT_API_TOKEN,
# the app generates one (data volume: .vulnsight_api_token) and the UI
# will ask for it. To listen on the LAN, change the ports bind and set
# VULNSIGHT_API_TOKEN yourself.
#
# GHSA fetches go through `gh`. A host `gh auth login` keeps the token in the
# OS keyring, which the container cannot read — export GH_TOKEN (or put it in
# .env) instead of mounting ~/.config/gh.
#
# Persist the SQLite cache / OSV bulk zips:
#   docker volume inspect vulnsight_vulnsight-data
# Or bind-mount by replacing the named volume with:  ./data:/data

services:
  vulnsight:
    build: .
    image: vulnsight:local
    ports:
      - "127.0.0.1:${PORT:-5000}:5000"
    env_file:
      - path: .env
        required: false
    environment:
      # HOST is read only by `python app.py`; the image runs gunicorn, so
      # VULNSIGHT_BIND is what tells the app what it is actually bound to.
      HOST: "0.0.0.0"
      VULNSIGHT_BIND: "0.0.0.0"
      PORT: "5000"
      VULNSIGHT_DATA_DIR: /data
      GH_TOKEN: ${GH_TOKEN:-}
      # Preferred over GH_TOKEN above: a value in `environment` is visible
      # in `docker inspect`, /proc/1/environ and `docker compose config`,
      # which is the first thing people paste into a bug report. Point this
      # at a file and the entrypoint reads it without it ever entering the
      # environment of anything but the app:
      #
      #   gh auth token > .gh_token && chmod 600 .gh_token
      #   GH_TOKEN= GH_TOKEN_FILE=/run/secrets/gh_token docker compose up
      #
      # Uncomment the `secrets:` blocks below to use the compose-native
      # form, which mounts it 0400 in a tmpfs.
      GH_TOKEN_FILE: ${GH_TOKEN_FILE:-}
    volumes:
      - vulnsight-data:/data
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/meta', timeout=5)",
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s

# secrets:
#   gh_token:
#     file: ./.gh_token
#
# and on the service:
#   secrets:
#     - gh_token
#   environment:
#     GH_TOKEN_FILE: /run/secrets/gh_token

volumes:
  vulnsight-data:
